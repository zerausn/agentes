<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uploaderbot - TikTok</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f0f;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #1a1a1a;
            border-radius: 16px;
            padding: 48px;
            text-align: center;
            max-width: 420px;
            width: 90%;
            border: 1px solid #2a2a2a;
        }
        .logo { font-size: 32px; font-weight: 700; margin-bottom: 8px; color: #fe2c55; }
        .subtitle { color: #888; margin-bottom: 32px; }
        .btn {
            display: inline-block;
            background: #fe2c55;
            color: #fff;
            padding: 14px 36px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: background 0.2s;
        }
        .btn:hover { background: #e0244a; }
        .user-info {
            background: #252525;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 24px;
            word-break: break-all;
            font-size: 13px;
            color: #aaa;
        }
        .actions { display: flex; flex-direction: column; gap: 12px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">Uploaderbot</div>
        <p class="subtitle">Sube videos a TikTok desde tu escritorio</p>
        {% if user %}
            <div class="user-info">✅ Conectado: {{ user.open_id[:16] }}...</div>
            <div class="actions">
                <a href="/upload" class="btn">Subir video</a>
                <a href="/logout" style="color:#666;font-size:13px;">Cerrar sesión</a>
            </div>
        {% else %}
            <a href="/login" class="btn">Iniciar sesión con TikTok</a>
        {% endif %}
    </div>
</body>
</html>
