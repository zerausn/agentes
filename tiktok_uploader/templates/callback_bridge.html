<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uploaderbot - OAuth Callback</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #0f0f0f;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 16px;
            max-width: 560px;
            width: 100%;
            padding: 28px;
        }
        h1 { font-size: 20px; margin-bottom: 10px; }
        p { color: #b8b8b8; line-height: 1.5; margin-bottom: 14px; }
        code {
            display: block;
            background: #111;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 12px;
            color: #8fe7ff;
            overflow-wrap: anywhere;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Procesando retorno de TikTok...</h1>
        <p id="message">Si TikTok devolvio el codigo en el fragmento de la URL, esta pagina lo reenviara automaticamente al servidor.</p>
        <p>Redirect URI esperado:</p>
        <code>{{ redirect_uri }}</code>
    </div>
    <script>
        const hashParams = new URLSearchParams(window.location.hash.slice(1));
        if (hashParams.toString()) {
            window.location.replace(window.location.pathname + "?" + hashParams.toString());
        } else {
            document.getElementById("message").textContent =
                "No llegaron parametros OAuth. Si acabas de autorizar en TikTok, revisa que el Redirect URI en el portal coincida exactamente con el mostrado arriba.";
        }
    </script>
</body>
</html>
