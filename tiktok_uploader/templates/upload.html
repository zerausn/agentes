<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uploaderbot - Subir Video</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f0f;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #1a1a1a;
            border-radius: 16px;
            padding: 32px;
            max-width: 520px;
            width: 90%;
            border: 1px solid #2a2a2a;
        }
        h1 { font-size: 20px; margin-bottom: 4px; }
        .note { color: #888; font-size: 13px; margin-bottom: 24px; }
        .drop-zone {
            border: 2px dashed #333;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: border 0.3s;
            margin-bottom: 16px;
        }
        .drop-zone:hover, .drop-zone.dragover { border-color: #fe2c55; }
        .drop-zone.has-file { border-color: #2ecc71; }
        .drop-zone input { display: none; }
        .drop-zone .icon { font-size: 40px; margin-bottom: 8px; }
        .drop-zone .text { color: #888; font-size: 14px; }
        .drop-zone .filename { color: #2ecc71; font-size: 14px; display: none; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 14px; color: #aaa; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            background: #252525;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
        }
        .form-group textarea { resize: vertical; min-height: 60px; }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-primary { background: #fe2c55; color: #fff; }
        .btn-primary:hover { background: #e0244a; }
        .btn-primary:disabled { background: #444; cursor: not-allowed; }
        .status {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            display: none;
        }
        .status.success { display: block; background: #1a3a1a; color: #2ecc71; border: 1px solid #2ecc71; }
        .status.error { display: block; background: #3a1a1a; color: #e74c3c; border: 1px solid #e74c3c; }
        .status.progress { display: block; background: #1a1a3a; color: #3498db; border: 1px solid #3498db; }
        .progress-bar {
            width: 100%;
            height: 4px;
            background: #333;
            border-radius: 2px;
            margin-top: 12px;
            overflow: hidden;
            display: none;
        }
        .progress-bar .fill {
            height: 100%;
            background: #fe2c55;
            width: 0%;
            transition: width 0.5s;
        }
        .back { display: inline-block; margin-bottom: 16px; color: #888; text-decoration: none; font-size: 13px; }
        .back:hover { color: #fff; }
    </style>
</head>
<body>
    <div class="card">
        <a href="/" class="back">&larr; Volver</a>
        <h1>Subir video a TikTok</h1>
        <p class="note">Duración máxima: {{ max_duration }}s &middot; MP4, MOV o WebM &middot; Máx 4GB</p>

        <div class="drop-zone" id="dropZone">
            <div class="icon">&#9654;</div>
            <div class="text">Arrastra tu video aquí o haz clic para seleccionar</div>
            <div class="filename" id="filename"></div>
            <input type="file" id="fileInput" accept="video/mp4,video/quicktime,video/webm">
        </div>

        <div class="form-group">
            <label>Título / Descripción</label>
            <textarea id="title" placeholder="Añade un título... (opcional)"></textarea>
        </div>
        <div class="form-group">
            <label>Privacidad</label>
            <select id="privacy">
                <option value="SELF_ONLY">Solo yo (para pruebas)</option>
                <option value="PUBLIC_TO_EVERYONE">Público</option>
                <option value="MUTUAL_FOLLOW_FRIENDS">Amigos</option>
            </select>
        </div>

        <button class="btn btn-primary" id="uploadBtn" onclick="startUpload()" disabled>Inicializar subida</button>

        <div class="progress-bar" id="progressBar"><div class="fill" id="progressFill"></div></div>
        <div class="status" id="status"></div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const filename = document.getElementById('filename');
        const uploadBtn = document.getElementById('uploadBtn');
        const status = document.getElementById('status');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const title = document.getElementById('title');
        const privacy = document.getElementById('privacy');

        let selectedFile = null;

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', () => { if (fileInput.files.length) handleFile(fileInput.files[0]); });

        function handleFile(file) {
            if (!file.type.startsWith('video/')) {
                showStatus('error', 'Solo se aceptan archivos de video.');
                return;
            }
            selectedFile = file;
            dropZone.classList.add('has-file');
            document.querySelector('.drop-zone .text').style.display = 'none';
            filename.style.display = 'block';
            filename.textContent = file.name + ' (' + (file.size / 1024 / 1024).toFixed(1) + ' MB)';
            uploadBtn.disabled = false;
            uploadBtn.textContent = 'Subir y publicar';
        }

        async function startUpload() {
            if (!selectedFile) return;
            uploadBtn.disabled = true;
            uploadBtn.textContent = 'Subiendo...';
            progressBar.style.display = 'block';

            try {
                // 1. Init upload
                showStatus('progress', 'Inicializando subida en TikTok...');
                const initResp = await fetch('/api/init-upload', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ size: selectedFile.size })
                });
                const initData = await initResp.json();
                if (initData.error && initData.error.code !== 'ok') {
                    showStatus('error', 'Error: ' + JSON.stringify(initData.error));
                    resetBtn();
                    return;
                }
                const uploadUrl = initData.data.upload_url;
                const publishId = initData.data.publish_id;

                // 2. Upload file
                showStatus('progress', 'Subiendo archivo a servidores de TikTok...');
                const formData = new FormData();
                formData.append('upload_url', uploadUrl);
                formData.append('file', selectedFile);
                const uploadResp = await fetch('/api/upload-file', { method: 'POST', body: formData });
                const uploadResult = await uploadResp.json();
                if (uploadResult.status !== 200) {
                    showStatus('error', 'Error al subir archivo: ' + uploadResult.reason);
                    resetBtn();
                    return;
                }

                progressFill.style.width = '50%';

                // 3. Publish
                showStatus('progress', 'Publicando video en TikTok...');
                const pubResp = await fetch('/api/publish', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        publish_id: publishId,
                        privacy_level: privacy.value,
                        title: title.value
                    })
                });
                const pubData = await pubResp.json();
                if (pubData.error && pubData.error.code !== 'ok') {
                    showStatus('error', 'Error al publicar: ' + JSON.stringify(pubData.error));
                    resetBtn();
                    return;
                }

                progressFill.style.width = '100%';
                showStatus('success', 'Video publicado exitosamente en TikTok!');
                uploadBtn.textContent = 'Subir otro video';
                uploadBtn.disabled = false;
                uploadBtn.onclick = () => location.reload();

            } catch (err) {
                showStatus('error', 'Error de conexión: ' + err.message);
                resetBtn();
            }
        }

        function showStatus(type, msg) {
            status.className = 'status ' + type;
            status.textContent = msg;
        }

        function resetBtn() {
            uploadBtn.disabled = false;
            uploadBtn.textContent = 'Subir y publicar';
        }
    </script>
</body>
</html>
